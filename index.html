<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Pulse Campus OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell. Persona-aware sidebar grouped by what the student is doing (Today / Campus life / Career / Give back / Run a club), sticky top bar with a persona switcher, one content column with an optional right rail. Visual language follows Pulse's own red + yellow on cool grey. */
:root{
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#E2E6ED; --line-2:#D3D9E2;
  --fg:#1A1F29; --fg-2:#4E5766; --fg-3:#667080;
  --red:#C8302A; --red-ink:#A3241F; --red-tint:#FCECEA; --on-red:#FFFFFF;
  --yellow:#E9B708; --yellow-tint:#FFF7DC; --yellow-line:#F0D77B; --yellow-ink:#5E4600; --on-yellow:#1A1F29;
  --green-tint:#DEF5E8; --green-ink:#1E6B44;
  --blue-tint:#E4EFFA; --blue-ink:#1F5E9C;
  --purple-tint:#EFEAFB; --purple-ink:#5B3FA8;
  --grey-tint:#EEF1F5; --grey-ink:#2E3542;
  --c1:#C8302A; --c1-on:#FFFFFF; --c2:#F2C94C; --c2-on:#1A1F29; --c3:#2F3A4D; --c3-on:#FFFFFF;
  --scrim:rgba(15,20,30,.45);
  --shadow:0 1px 2px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --surface:#1A1E26; --surface-2:#222732; --line:#2C323E; --line-2:#3A4150;
    --fg:#E9ECF2; --fg-2:#B4BBC8; --fg-3:#959DAC;
    --red:#D23A32; --red-ink:#FF9A92; --red-tint:#3A1D1C; --on-red:#FFFFFF;
    --yellow:#E9B708; --yellow-tint:#2B2410; --yellow-line:#5C4A12; --yellow-ink:#F2D27A; --on-yellow:#1A1F29;
    --green-tint:#14301F; --green-ink:#86DBAC;
    --blue-tint:#16263A; --blue-ink:#9CC6F2;
    --purple-tint:#261F3D; --purple-ink:#C3B2F7;
    --grey-tint:#262B36; --grey-ink:#D3D8E2;
    --c1:#E0473F; --c1-on:#FFFFFF; --c2:#F2C94C; --c2-on:#1A1F29; --c3:#A9B6CC; --c3-on:#12151B;
    --scrim:rgba(0,0,0,.6);
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1A1E26; --surface-2:#222732; --line:#2C323E; --line-2:#3A4150;
  --fg:#E9ECF2; --fg-2:#B4BBC8; --fg-3:#959DAC;
  --red:#D23A32; --red-ink:#FF9A92; --red-tint:#3A1D1C; --on-red:#FFFFFF;
  --yellow:#E9B708; --yellow-tint:#2B2410; --yellow-line:#5C4A12; --yellow-ink:#F2D27A; --on-yellow:#1A1F29;
  --green-tint:#14301F; --green-ink:#86DBAC;
  --blue-tint:#16263A; --blue-ink:#9CC6F2;
  --purple-tint:#261F3D; --purple-ink:#C3B2F7;
  --grey-tint:#262B36; --grey-ink:#D3D8E2;
  --c1:#E0473F; --c1-on:#FFFFFF; --c2:#F2C94C; --c2-on:#1A1F29; --c3:#A9B6CC; --c3-on:#12151B;
  --scrim:rgba(0,0,0,.6);
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
a{color:var(--red-ink)}
button{font:inherit}
.ic{flex-shrink:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Shell */
.app{display:flex;min-height:100vh}
.side{width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--on-red)}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--fg-3)}
.share{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin:0 2px 6px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--red-ink);font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
button.small{background:none;border:0;padding:0;cursor:pointer;font-family:inherit;align-self:flex-start;min-height:36px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-head{padding:14px 12px 6px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--grey-ink);font:inherit;font-size:14px;font-weight:500;text-align:left;text-decoration:none;cursor:pointer}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.phase{margin-left:auto;padding:1px 6px;border-radius:999px;background:var(--grey-tint);color:var(--fg-3);font-size:10px;font-weight:800;letter-spacing:.04em}
.nav-item.is-active .phase{background:var(--surface);color:var(--red-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-item.is-active{background:var(--red-tint);color:var(--red-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--red)}
.side-foot{margin-top:auto;padding:16px 8px 0;font-size:12px;line-height:1.5;color:var(--fg-3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:64px;display:flex;align-items:center;gap:12px;padding-inline:24px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.menu-btn{display:none}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-3);white-space:nowrap;min-width:0}
.crumb b{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;color:var(--fg-3);background:var(--surface)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);font:inherit;font-size:14px}
.concept{margin-left:auto;padding:5px 10px;border-radius:999px;background:var(--yellow-tint);border:1px solid var(--yellow-line);color:var(--yellow-ink);font-size:12px;font-weight:700;white-space:nowrap}
.persona{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--fg-3)}
.persona select{min-height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;font-weight:700;max-width:220px}
.me{border:0;cursor:pointer;font-family:inherit;width:40px;height:40px;flex-shrink:0;border-radius:999px;background:var(--red-tint);color:var(--red-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.view{width:100%;max-width:1200px;margin-inline:auto;padding-inline:32px;padding-block:28px 72px;display:flex;flex-direction:column;gap:20px;container-type:inline-size}
.scrim{display:none}

/* Type and blocks */
h1{margin:0;font-size:clamp(26px,3.2vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:18px;font-weight:800;line-height:1.3;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:800;line-height:1.35}
p{margin:0}
.lede{color:var(--fg-2);max-width:68ch;font-size:15px;line-height:1.6}
.muted{color:var(--fg-2);font-size:13px;line-height:1.5}
.small{font-size:12px;color:var(--fg-3);line-height:1.45}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.eyebrow-chip{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--red-tint);color:var(--red-ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.ph-text{display:flex;flex-direction:column;gap:8px;max-width:760px;min-width:0}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.callout{background:var(--yellow-tint);border:1px solid var(--yellow-line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.callout .eyebrow{color:var(--yellow-ink)}
.dashed{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-even{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat-v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-s{font-size:13px;color:var(--fg-2);line-height:1.45}

/* Chips and buttons */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5;max-width:100%}
.t-red{background:var(--red-tint);color:var(--red-ink)}
.t-green{background:var(--green-tint);color:var(--green-ink)}
.t-blue{background:var(--blue-tint);color:var(--blue-ink)}
.t-purple{background:var(--purple-tint);color:var(--purple-ink)}
.t-yellow{background:var(--yellow-tint);color:var(--yellow-ink);box-shadow:inset 0 0 0 1px var(--yellow-line)}
.t-grey{background:var(--grey-tint);color:var(--grey-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:700;line-height:1.3;text-align:center;cursor:pointer;text-decoration:none;max-width:100%;flex-shrink:0}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-red:hover{filter:brightness(.94)}
.btn-out{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn-out:hover{background:var(--surface-2)}
.btn-yel{background:var(--yellow);color:var(--on-yellow)}
.btn-ghost{background:transparent;color:var(--fg-2)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.done{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;background:var(--green-tint);color:var(--green-ink);font-size:14px;font-weight:700;line-height:1.3;max-width:100%;flex-shrink:0}
.done.sm{min-height:36px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.seg button .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}

/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row.top-a{align-items:flex-start}
.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-size:16px;font-weight:700;line-height:1.35}
.row-meta{font-size:13px;color:var(--fg-2);line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.date{width:52px;height:56px;border-radius:12px;background:var(--red-tint);color:var(--red-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.date b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.date span{font-size:10px;font-weight:800;letter-spacing:.08em}
.av{width:38px;height:38px;border-radius:999px;background:var(--red-tint);color:var(--red-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.tile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--yellow-tint);color:var(--yellow-ink)}
.tile.red{background:var(--red-tint);color:var(--red-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--grey-ink);background:var(--surface)}
.pill .ic{color:var(--red)}
.bar{height:8px;border-radius:999px;background:var(--grey-tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--red)}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--grey-ink)}
.checkline .ic{margin-top:2px}
.ok{color:var(--green-ink)}
.warn{color:var(--yellow-ink)}

/* Week strip */
.hscroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px;padding-bottom:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:8px;min-width:700px}
.day{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:168px}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h span{font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase}
.day-h b{font-size:18px;font-variant-numeric:tabular-nums}
.day.today{box-shadow:inset 0 0 0 2px var(--red)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35}
.ev b{display:block}
.ev span{color:var(--fg-3)}

/* Events */
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.legend .card{gap:8px;padding:18px}
.event{display:flex;flex-direction:column;gap:12px;padding:18px 0;border-top:1px solid var(--line)}
.event-main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;line-height:1.45;color:var(--grey-ink)}
.rules span{display:flex;gap:8px;align-items:flex-start}
.rules .ic{margin-top:2px;color:var(--fg-3)}
.inline-form{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:10px 12px;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
.field textarea{min-height:84px;resize:vertical;line-height:1.55}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;background:var(--surface)}
.choice input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--red);flex-shrink:0}
.choice:has(input:checked){border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-tint)}
.choice b{display:block;font-size:14px}
.choice span{font-size:13px;color:var(--fg-2);line-height:1.45}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--red);flex-shrink:0}

/* Clubs */
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.club-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.club-top{display:flex;gap:12px;align-items:center}
.club-logo{width:48px;height:48px;border-radius:12px;background:var(--red-tint);color:var(--red-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.club-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.hero{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.hero .club-logo{width:76px;height:76px;border-radius:18px;font-size:26px}
.meta-line{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.meta-line strong{color:var(--fg)}
.mem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.mem i{width:10px;height:10px;margin-top:6px;border-radius:999px;background:var(--red);flex-shrink:0}

/* CV */
.ev-card{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.ev-card[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-tint)}
.ev-card .t{font-size:15px;font-weight:700}
.list-gap{display:flex;flex-direction:column;gap:10px}
.review{padding:12px 14px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.review b{font-size:12px;color:var(--red-ink)}

/* Compendium */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.chart .seg-l{font-size:12px;font-weight:700;font-family:var(--font)}
.chart rect{stroke:var(--surface);stroke-width:1.5}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.heat-wrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:4px;font-size:13px;min-width:460px;width:100%}
.heat th{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:4px 6px}
.heat td{text-align:center;padding:10px 6px;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}
.heat td.rowh{text-align:left;font-weight:700;color:var(--fg);padding-left:6px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:6px 12px;align-items:center}
.hbar .lbl{font-size:13px;line-height:1.4}
.hbar .num{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.hbar .bar{grid-column:1 / -1;height:8px}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.insight .ic{color:var(--red);margin-top:3px}
.entry{padding:16px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.entry-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

/* Seniors */

/* ---------- Helpers ---------- */
function allowed(route){
  if (route==="club" || route==="person" || route==="welcome") return STUDENTS.indexOf(S.persona)>=0;
  for (var g=0; g<NAV.length; g++){ for (var i=0;i<NAV[g].items.length;i++){ var it=NAV[g].items[i]; if (it.id===route) return it.who.indexOf(S.persona)>=0; } }
  return false;
}
function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function isBooked(slotId){ return S.bookings.some(function(b){ return b.slot===slotId; }); }
function allEvents(){ return S.created.filter(function(e){ return !e.pending; }).concat(EVENTS); }
function clubName(e){ if (e.club){ var c=clubById(e.club); return c?c.name:e.club; } return e.clubName; }

V.week = function(){
  var W = WEEK[S.persona];
  var acts = W.actions.map(function(a){
    var isDone = a.rated ? !!S.rated["ev:"+a.rated] : a.reg ? !!S.eventReg[a.reg] : !!S.done[S.persona+":"+a.id];
    var btn;
    if (isDone) btn = doneChip(a.doneLabel);
    else if (a.route) btn = '<button type="button" class="btn btn-red" data-go="'+a.route+'"'+((a.act||a.tab)?' data-act="'+(a.act||"consoleTab")+'" data-arg="'+(a.arg||a.tab)+'"':'')+'>'+a.cta+'</button>';
    else if (a.reg) btn = '<button type="button" class="btn btn-red" data-act="quickReg" data-arg="'+a.reg+'">'+a.cta+'</button>';
    else btn = '<button type="button" class="btn btn-red" data-act="done" data-arg="'+a.id+'">'+a.cta+'</button>';
    return '<div class="row wrap">'+dateTile(a.day)+'<div class="grow"><div class="tags">'+chip(a.tag,a.tone)+'</div><div class="row-title">'+a.title+'</div><div class="row-meta">'+a.meta+'</div></div>'+btn+'</div>';
  }).join("");
  var days = W.days.map(function(d, i){
    return '<div class="day'+(i===0?' today':'')+'"><div class="day-h"><span>'+d[0]+(i===0?' · today':'')+'</span><b>'+d[1]+'</b></div>'+d[2].map(function(e){ return '<div class="ev"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>'; }).join("")+'</div>';

function initials(s){ var w=String(s).split(" ·")[0].split(" ").filter(Boolean); return ((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase(); }
function photoTiles(label, n, pickKey){
  var h='<div class="photo-grid">';
  for (var i=1;i<=n;i++){
    if (pickKey){
      var on = !!(S.picks[pickKey]||{})[i];
      h+='<button type="button" class="photo" data-act="pickPhoto" data-arg="'+pickKey+':'+i+'" aria-pressed="'+on+'" aria-label="Photo '+i+(on?', selected for the report':'')+'">'+(on?'<span class="tick">'+ic("check",12)+'</span>':'')+ic("camera",18)+'<span>'+label+' · '+i+'</span></button>';
    } else h+='<div class="photo">'+ic("camera",18)+'<span>'+label+' · '+i+'</span></div>';
  }
  return h+'</div>';
}
function replyCount(p){ return (p.replies||[]).length + (S.extraReplies[p.id]||[]).length; }
function whyLine(p){
  if (S.feedSort!=="foryou") return "";
  var why = p.why || (S.topics[p.topic] ? "You follow "+p.topic : (p.kind==="event" ? "From a club you follow" : ""));
  return why ? '<span class="small" style="display:flex;gap:6px;align-items:center">'+ic("eye",13)+esc(why)+'</span>' : "";
}

    (p.kind==="ask"?'<button type="button" class="btn btn-sm btn-ghost" data-act="toggleReplies" data-arg="'+p.id+'" aria-expanded="'+(!!S.openReplies[p.id])+'">'+ic("feed",15)+'Replies · '+replyCount(p)+'</button>':'')+
    '<button type="button" class="btn btn-sm btn-ghost" data-act="save" data-arg="'+p.id+'" aria-pressed="'+saved+'">'+(saved?'Saved':'Save')+'</button>'+
    (p.kind!=="sponsored"?'<button type="button" class="btn btn-sm btn-ghost" data-act="report" data-arg="'+p.id+'">Report</button>':'')+'</div>';
  var byline = p.kind==="event" ? "Event from a club you follow" : (p.when+' · '+(p.scope==="all"?"Everyone on Pulse":"IIM Lucknow only"));
  return '<article class="post"><div class="post-h"><span class="av">'+initials(p.by)+'</span><div class="grow" style="flex-basis:160px"><b style="font-size:14px">'+esc(p.by)+'</b><span class="small">'+esc(byline)+'</span></div>'+chip(ic(K.icon,12)+' '+K.label, K.tone)+(p.topic?chip(esc(p.topic),"grey"):"")+(p.pending?chip("Waiting for club approval","yellow"):"")+(p.routed?chip("Sent to 3 seniors","blue"):"")+'</div>'+whyLine(p)+(p.title?'<div class="post-t">'+esc(p.title)+'</div>':'')+body+replies+footer+'</article>';

V.feed = function(){
  var all = S.posts.concat(FEED).filter(function(p){ return !(p.kind==="sponsored" && S.hideSponsor); });
  if (S.feedTopic!=="all") all = all.filter(function(p){ return p.topic===S.feedTopic; });
  if (S.feedKind!=="all") all = all.filter(function(p){ return p.kind===S.feedKind; });
  var list, sort=S.feedSort;
  if (sort==="foryou"){
    var sp = all.filter(function(p){ return p.kind==="sponsored"; });
    var rest = all.filter(function(p){ return p.kind!=="sponsored"; });
    rest = rest.map(function(p,i){ return [p,i]; }).sort(function(a,b){ var fa=S.topics[a[0].topic]?0:1, fb=S.topics[b[0].topic]?0:1; return fa-fb || a[1]-b[1]; }).map(function(x){ return x[0]; });
    if (sp.length) rest.splice(Math.min(2, rest.length), 0, sp[0]);
    list = rest;
  } else if (sort==="popular"){
    list = all.filter(function(p){ return p.kind!=="sponsored"; }).slice().sort(function(a,b){ return (b.recog+replyCount(b)*2)-(a.recog+replyCount(a)*2); });
  } else if (sort==="unanswered"){
    list = all.filter(function(p){ return p.kind==="ask" && replyCount(p)===0; });
  } else if (sort==="saved"){
    list = all.filter(function(p){ return S.saved[p.id]; });
  } else list = all.filter(function(p){ return p.kind!=="sponsored"; });
  var top = S.posts.concat(FEED).filter(function(p){ return p.kind!=="sponsored" && p.kind!=="event"; }).slice().sort(function(a,b){ return b.recog-a.recog; }).slice(0,3);
  var savedN = Object.keys(S.saved).filter(function(k){ return S.saved[k]; }).length;
  var empty = sort==="saved" ? "Nothing saved yet. Use Save on any post to keep it here." : sort==="unanswered" ? "Every question has a reply. Nice." : "Nothing matches these filters.";
  return head("Campus life", "Feed", "Questions, polls, shout-outs, builds, event photos, survey requests and events from your college and other campuses. Each post type has a job, and the feed is ranked by what you follow rather than by what is loudest.", "") +
    '<div class="grid2"><div class="col">'+composer()+

/* ---------- Budget, approvals and ratings ---------- */
function inr(n){ n=Math.round(n); var s=String(Math.abs(n)), last3=s.slice(-3), rest=s.slice(0,-3); if (rest) last3=","+last3; rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g, ","); return (n<0?"−":"")+"₹"+rest+last3; }
function lineById(id){ var r=null; S.budget.lines.forEach(function(l){ if (l.id===id) r=l; }); return r; }
function claimById(id){ var r=null; S.claims.forEach(function(c){ if (c.id===id) r=c; }); return r; }
function lineActual(l){ return l.settled + S.expenses.filter(function(x){ return x.ev===l.id; }).reduce(function(a,x){ return a+x.amt; },0); }
function claimAmt(c){ return c.amt!==undefined ? c.amt : S.expenses.filter(function(x){ return x.claim===c.id; }).reduce(function(a,x){ return a+x.amt; },0); }
function budgetTotals(){
  var B=S.budget, spent=0, pending=0, planned=0;
  B.lines.forEach(function(l){
    spent += l.settled;
    var act=lineActual(l);
    if (!l.done) planned += Math.max(l.cap-act,0);
  });
  S.expenses.forEach(function(x){
    var c=x.claim?claimById(x.claim):null;
    if (c && (c.status==="Approved"||c.status==="Paid")) spent+=x.amt; else pending+=x.amt;
  });
  var avail=B.alloc+B.sponsor;
  return {avail:avail, spent:spent, pending:pending, planned:planned, free:avail-spent-pending-planned};
}
function claimChecks(c){
  if (c.static) return [[1,"Event verified by Pulse check-ins"],[1,"Within the event’s planned spend, or over-spend justified"],[1,"A bill attached for every item"],[1,"No duplicate bills across clubs"]];
  var items=S.expenses.filter(function(x){ return x.claim===c.id; });
  var l=lineById(c.ev), act=lineActual(l), over=act-l.cap;
  var billsOk=items.every(function(x){ return x.bill; }), gstOk=items.every(function(x){ return x.amt<1000 || x.gst; });
  return [
    [l.verified?1:0, l.verified ? "Event verified: "+l.verified : "Event hasn’t happened yet, so it can’t be verified"],
    [over<=0 || !!c.just ? 1:0, over<=0 ? "Within the planned spend of "+inr(l.cap) : ("Over the planned spend by "+inr(over)+(c.just?" · justification: “"+esc(c.just)+"”":" · no justification given"))],
    [billsOk?1:0, billsOk ? "A bill attached for every item" : "Some items have no bill"],
    [gstOk?1:0, gstOk ? "GST invoices for items over ₹1,000" : "An item over ₹1,000 has no GST invoice"],
    [1, "No duplicate bills across clubs"]
  ];
}
function statusTone(s){ return s==="Paid"?"green":s==="Approved"?"green":s==="Query raised"?"yellow":s==="Rejected"?"grey":"blue"; }

  }).join("");
  var P=S.proposal, totalAsk=P.lines.reduce(function(a,l){ return a+(Number(l.ask)||0); },0);
  var prop='<section class="card"><div class="card-head"><h2>Earmark next year · 2027–28</h2>'+chip(P.status==="draft"?"Draft":P.status==="submitted"?"Submitted to the Student Council":"Approved: "+inr(P.approved), P.status==="approved"?"green":P.status==="submitted"?"blue":"grey")+'</div><p class="muted">Drafted from this year’s actual spend and each event’s verified attendance and ratings, so the ask comes with evidence. The next core inherits whatever is approved.</p><div class="list-gap">'+P.lines.map(function(l,i){ return '<div class="row wrap top-a"><div class="grow" style="flex-basis:220px"><b style="font-size:14px">'+esc(l.name)+'</b><span class="small">This year: '+(l.last?inr(l.last):"new")+' · '+esc(l.why)+'</span></div><div class="field" style="width:150px"><label for="ask-'+i+'">Ask</label><input id="ask-'+i+'" inputmode="numeric" data-change="ask" data-arg="'+i+'" value="'+l.ask+'"'+(P.status!=="draft"?' disabled':'')+'></div></div>'; }).join("")+'</div><div class="row" style="justify-content:space-between"><span class="muted">Total ask vs this year’s allocation of '+inr(B.alloc)+'</span><b style="font-variant-numeric:tabular-nums">'+inr(totalAsk)+' ('+(totalAsk>=B.alloc?"+":"")+Math.round((totalAsk-B.alloc)/B.alloc*100)+'%)</b></div>'+(P.status==="draft"?'<button type="button" class="btn btn-red" data-act="submitProposal">Submit proposal to the Student Council</button>':'')+'</section>';
  return stats([["Available",inr(T.avail),inr(B.alloc)+" allocation + "+inr(B.sponsor)+" sponsor income"],["Spent",inr(T.spent),"approved or reimbursed"],["Claims pending",inr(T.pending),"bills not yet reimbursed"],["Not yet planned",inr(T.free),"free for new events this year"]]) +
    '<section class="card"><div class="card-head"><h2>FY 2026–27 budget</h2><span class="small">Allocated by the Student Council · July 2026</span></div>'+bar+'</section>' +

function riceTable(rows, unit){
  var r=rows.map(function(x){ return x.concat([x[1]*x[2]*x[3]/x[4]]); }).sort(function(a,b){ return b[7]-a[7]; });
  return '<div class="matrix-wrap"><table class="matrix" style="min-width:860px"><thead><tr><th scope="col">Feature</th><th scope="col">Reach ('+unit+')</th><th scope="col">Impact</th><th scope="col">Confidence</th><th scope="col">Effort (person-weeks)</th><th scope="col">RICE</th><th scope="col">Phase</th><th scope="col">Judgement call</th></tr></thead><tbody>'+r.map(function(x){ return '<tr><th scope="row" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)">'+x[0]+'</th><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+Math.round(x[3]*100)+'%</td><td>'+x[4]+'</td><td><b>'+(x[7]>=100?Math.round(x[7]):x[7].toFixed(1))+'</b></td><td>'+chip(x[5], x[5]==="M1"?"green":x[5]==="M2"?"blue":x[5]==="M3"?"purple":"grey")+'</td><td style="min-width:220px;white-space:normal">'+(x[6]||'<span class="small">Follows the score</span>')+'</td></tr>'; }).join("")+'</tbody></table></div>';
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act],[data-go]");
  if (!el) return;
  var act = el.getAttribute("data-act"), dest = el.getAttribute("data-go");
  if (el.tagName==="A") e.preventDefault();
  if (act && A[act]) A[act](el.getAttribute("data-arg"), el, e);
  if (dest){ if (S.route!==dest) go(dest); else if (S.navOpen){ S.navOpen=false; render(); } }
});
document.addEventListener("input", function(e){
  var el=e.target, b=el.getAttribute && el.getAttribute("data-bind");
  if (b==="draft") S.drafts[el.getAttribute("data-arg")] = el.value;
  if (b==="ne") S.ne[el.getAttribute("data-arg")] = el.value;
  if (b==="newForm") S.newForm = el.value;
  if (b==="faculty") S.faculty = el.value;
});
document.addEventListener("change", function(e){
  var el=e.target, c=el.getAttribute && el.getAttribute("data-change");
  if (el.getAttribute && el.getAttribute("data-bind")==="ne"){ S.ne[el.getAttribute("data-arg")] = el.value; }
  if (!c) return;
  if (c==="scope"){ S.ne.scope=el.value; render(); }
  if (c==="regon"){ S.ne.regOn=el.value; render(); }
  if (c==="toggle"){ S.tg[el.getAttribute("data-arg")]=el.checked; }
  if (c==="alslot"){ S.alum.slot=el.value; }
  if (c==="almocks"){ S.alum.mocks=el.checked; }

  if (c==="peopleOpen"){ S.peopleOpen=el.value; render(); }
  if (c==="priv"){ S.priv[el.getAttribute("data-arg")]=el.value; render(); }
  if (c==="privBool"){ S.priv[el.getAttribute("data-arg")]=el.checked; render(); }
  if (c==="openTo"){ S.openTo[el.getAttribute("data-arg")]=el.checked; }
  if (c==="faceToggle"){ S.faceOn=el.checked; if (!el.checked) S.face={}; render(); toast(el.checked?"Photo matching is on.":"Photo matching is off and your face data is deleted."); }
  if (c==="neBudget"){ render(); }

});

    '<form class="card" data-form="batchItem"><h2>Publish a batch essential</h2><p class="muted">Goes into every '+(season==="finals"?"PGP2":"PGP1")+' student’s repository, without anyone following anything.</p><div class="field"><label for="bi-title">Title</label><input id="bi-title" name="title" required placeholder="e.g. Group discussion guidelines"></div><div class="field"><label for="bi-type">Type</label><select id="bi-type" name="type"><option>Notes</option><option>Template</option><option>Roadmap</option><option>PYQs</option></select></div><button class="btn btn-red" type="submit">Publish to the batch</button></form>' +
    '<section class="card"><h3>Updates from domain clubs</h3>'+(S.clubShares.length?'<div class="rows">'+S.clubShares.map(function(i){ return '<div class="row"><span class="tile">'+ic("file",16)+'</span><span class="grow"><b style="font-size:14px">'+esc(i.title)+'</b><span class="small">'+esc(clubById(i.src).name)+' · '+esc(i.type)+' · today</span></span></div>'; }).join("")+'</div>':'<p class="muted">When a club shares material with its followers, it shows here and the track’s health updates.</p>')+'</section>' +
    '<section class="card"><h3>Batch essentials</h3><div class="rows">'+repoFor("placecom").map(function(i){ return '<div class="row"><span class="tile">'+ic("file",16)+'</span><span class="grow"><b style="font-size:14px">'+esc(i.title)+'</b><span class="small">'+esc(i.type)+'</span></span></div>'; }).join("")+'</div></section></div></div>';
